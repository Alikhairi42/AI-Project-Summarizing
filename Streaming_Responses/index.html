<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream AI Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { background-color: #2b2b40; width: 500px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .input-box {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 10px; 
        border-radius: 5px;
        border: 1px solid transparent; 
        background-color: #3e3e5e; 
        color: white; 
        outline: none;
        }
        .input-box:focus {
        border-color: #6c5ce7;
        }
        button { width: 100%; padding: 10px; background-color: #3b82f6; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2563eb; }
        
        .result-box { 
            margin-top: 20px; 
            padding: 20px;
            background-color: #1e1e2f; 
            border-radius: 8px; 
            min-height: 50px; 
            border: 1px solid #3e3e5e; 
        }
        .answer { 
            font-size: 16px; 
            line-height: 0.7;
            letter-spacing: 0.3px; 
        }
        .cursor { display: inline-block; width: 8px; height: 18px; background-color: #3b82f6; animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>⚡ Stream AI Chat</h2>
        <input type="text" id="questionInput" class="input-box" placeholder="Swel L-AI...">
        <button onclick="askAI()" id="sendBtn">Sifet (Stream)</button>

        <div class="result-box">
            <div class="answer" id="answerText"><span class="cursor" id="cursor"></span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
