<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Mini server by Ali</title>
    <style>
        
        body { font-family: Arial, sans-serif; background-color: #1e1e2f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { background-color: #2b2b40; width: 500px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .input-box { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; box-sizing: border-box; background-color: #3e3e5e; color: white; }
        button { width: 100%; padding: 10px; background-color: #4ade80; border: none; border-radius: 5px; color: #1e1e2f; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #22c55e; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #1e1e2f; border-radius: 5px; display: none; }
        .thinking { color: #9ca3af; font-style: italic; font-size: 14px; margin-bottom: 10px; }
        .answer { font-size: 16px; line-height: 1.5; }
        .loading { text-align: center; display: none; color: #4ade80; }
        h2 { text-align: center; color: #4ade80; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Mini AI Chat</h2>
        <input type="text" id="questionInput" class="input-box" placeholder="Enter your question... ">
        <button onclick="askAI()">Send question</button>
        <p class="loading" id="loadingText">⏳ AI is thinking....</p>
        <div class="result-box" id="resultBox">
            <div class="thinking" id="thinkingText"></div>
            <div class="answer" id="answerText"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
